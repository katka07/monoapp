<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host Info Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 2rem;
        min-height: 100vh;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
        color: #f8fafc;
      }
      .subtitle {
        color: #94a3b8;
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }
      .pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 2s infinite;
        margin-right: 6px;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1rem;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 1.25rem;
      }
      .card h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 0.75rem;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 0.35rem 0;
      }
      .label {
        color: #94a3b8;
        font-size: 0.875rem;
      }
      .value {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.875rem;
        color: #f1f5f9;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .badge-yes {
        background: #166534;
        color: #86efac;
      }
      .badge-no {
        background: #7f1d1d;
        color: #fca5a5;
      }
      .updated {
        margin-top: 2rem;
        color: #64748b;
        font-size: 0.75rem;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Host Info Dashboard</h1>
    <p class="subtitle">
      <span class="pulse"></span>Auto-refreshing every 2 seconds
    </p>

    <div class="grid">
      <div class="card">
        <h2>Host</h2>
        <div class="row">
          <span class="label">Hostname</span>
          <span class="value" id="hostname" th:text="${info.hostname}">—</span>
        </div>
        <div class="row">
          <span class="label">IP Address</span>
          <span class="value" id="ipAddress" th:text="${info.ipAddress}"
            >—</span
          >
        </div>
        <div class="row">
          <span class="label">Instance ID</span>
          <span class="value" id="instanceId" th:text="${info.instanceId}"
            >—</span
          >
        </div>
      </div>

      <div class="card">
        <h2>Container</h2>
        <div class="row">
          <span class="label">Is Container</span>
          <span
            id="container"
            th:classappend="${info.container} ? 'badge badge-yes' : 'badge badge-no'"
            th:text="${info.container} ? 'YES' : 'NO'"
            >—</span
          >
        </div>
        <div class="row">
          <span class="label">Container ID</span>
          <span class="value" id="containerId" th:text="${info.containerId}"
            >—</span
          >
        </div>
        <div class="row">
          <span class="label">Kubernetes</span>
          <span
            id="kubernetes"
            th:classappend="${info.kubernetes} ? 'badge badge-yes' : 'badge badge-no'"
            th:text="${info.kubernetes} ? 'YES' : 'NO'"
            >—</span
          >
        </div>
      </div>

      <div class="card">
        <h2>Time</h2>
        <div class="row">
          <span class="label">UTC</span>
          <span
            class="value"
            id="currentTimeUtc"
            th:text="${info.currentTimeUtc}"
            >—</span
          >
        </div>
        <div class="row">
          <span class="label">Local</span>
          <span
            class="value"
            id="currentTimeLocal"
            th:text="${info.currentTimeLocal}"
            >—</span
          >
        </div>
      </div>

      <div class="card">
        <h2>Environment &amp; Build</h2>
        <div class="row">
          <span class="label">Profile</span>
          <span class="value" id="environment" th:text="${info.environment}"
            >—</span
          >
        </div>
        <div class="row">
          <span class="label">Version</span>
          <span class="value" id="appVersion" th:text="${info.appVersion}"
            >—</span
          >
        </div>
        <div class="row">
          <span class="label">Git SHA</span>
          <span class="value" id="gitSha" th:text="${info.gitSha}">—</span>
        </div>
      </div>
    </div>

    <p class="updated">Last updated: <span id="lastUpdated">—</span></p>

    <script src="/js/app.js"></script>
  </body>
</html>
