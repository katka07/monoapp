spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.example: INFO
